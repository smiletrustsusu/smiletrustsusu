<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#0f7668" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SMILE TRUST SUSU MANAGEMENT SYSTEM</title>
    <link rel="icon" type="image/png" sizes="192x192" href="assets/smile-trust-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/smile-trust-icon-512.png" />
    <link rel="apple-touch-icon" href="assets/smile-trust-icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="styles-mobile.css" />
    <script src="vendor/xlsx.full.min.js" defer></script>
    <script src="vendor/mammoth.browser.min.js" defer></script>
  </head>
  <body>
    <div id="app">
      <main class="auth">
        <section class="login-panel">
          <h2>SMILE TRUST SUSU MANAGEMENT SYSTEM</h2>
          <p class="muted">Loading application...</p>
        </section>
      </main>
    </div>
    <script type="module" src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator && !/Electron/i.test(navigator.userAgent)) {
        window.addEventListener("load", () => {
          if (/Android/i.test(navigator.userAgent)) {
            navigator.serviceWorker.getRegistrations()
              .then((registrations) => registrations.forEach((registration) => registration.unregister()))
              .catch(() => {});
            return;
          }
          navigator.serviceWorker.register("./service-worker.js").catch(() => {});
        });
      }
      window.addEventListener("error", (event) => {
        const root = document.querySelector("#app");
        if (!root || root.dataset.ready === "true") return;
        root.innerHTML = `<main class="auth"><section class="login-panel"><h2>Unable to start</h2><p class="notice">${event.message || "Application failed to load."}</p></section></main>`;
      });
    </script>
  </body>
</html>
